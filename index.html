<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  
  <!-- SEO Meta Tags -->
  <title>Manpreet Kaur | Web Designer & Frontend Developer Portfolio</title>
  <meta name="description" content="Personal developer portfolio of Manpreet Kaur - Web Designer & Frontend Developer showcasing React, Tailwind CSS, and web design projects." />
  <meta name="author" content="Manpreet Kaur" />

  <!-- Google Fonts: Outfit & Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            heading: ['Outfit', 'sans-serif'],
          },
        },
      },
    }
  </script>

  <!-- React 18, ReactDOM, and Babel Standalone UMD Bundles -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Custom CSS Design Tokens & Styles -->
  <link rel="stylesheet" href="./src/index.css" />
</head>
<body class="bg-[#090d16] text-slate-100 antialiased selection:bg-indigo-500 selection:text-white">
  
  <!-- Root React App Mount Container -->
  <div id="root"></div>

  <!-- Main React Application Script -->
  <script type="text/babel" src="./src/main.js"></script>

</body>
</html>
